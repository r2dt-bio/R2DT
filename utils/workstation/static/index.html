<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R2DT workstation</title>
<link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg">
<link rel="shortcut icon" href="/static/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/static/chrome.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="ws-dashboard">
<header class="ws-chrome">
  <a class="ws-chrome-brand" href="/" title="Back to dashboard">
    <img class="ws-chrome-logo" src="/static/r2dt-logo-blue.svg" alt="">
    <span>R2DT workstation</span>
  </a>
</header>

<section id="panel-dashboard" class="panel active">
  <div class="toolbar">
    <input id="filter" type="search" placeholder="Filter by label or filename…" autocomplete="off">
    <button type="button" id="refresh">Refresh</button>
    <span class="count" id="count"></span>
    <button type="button" class="cta" id="new-comparison" data-panel="new">New comparison</button>
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr>
          <th class="num" data-sort="seq" title="Stable job number (oldest first)">#</th>
          <th data-sort="label">Label</th>
          <th data-sort="ref">Reference</th>
          <th data-sort="model">Model</th>
          <th data-sort="chains">Chains</th>
          <th data-sort="created">Created</th>
          <th class="num" data-sort="inf_wc">INF WC</th>
          <th class="num" data-sort="inf_nwc">INF non-WC</th>
          <th class="num" data-sort="inf_all">INF all</th>
          <th data-sort="bp">BP (M/L/A)</th>
          <th data-sort="status">Status</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <pre id="log" class="log hidden" aria-live="polite"></pre>
</section>

<section id="panel-new" class="panel">
  <div class="new-head">
    <button type="button" class="linkish" id="back-dashboard" data-panel="dashboard">← Back to jobs</button>
    <h2>New comparison</h2>
  </div>
  <form id="new-form">
    <fieldset>
      <legend>Structures</legend>
      <div class="row">
        <label>Reference (PDB or mmCIF)
          <input type="file" id="ref-file" accept=".cif,.pdb,.cif.gz,.pdb.gz,.CIF,.PDB">
        </label>
        <div id="ref-chains" class="chains"></div>
      </div>
      <div class="row">
        <label>Model (PDB or mmCIF)
          <input type="file" id="model-file" accept=".cif,.pdb,.cif.gz,.pdb.gz,.CIF,.PDB">
        </label>
        <div id="model-chains" class="chains"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Options</legend>
      <div class="row opts">
        <label>Mode
          <select id="mode">
            <option value="auto" selected>auto</option>
            <option value="templated">templated</option>
            <option value="templatefree">templatefree</option>
          </select>
        </label>
        <label>Base pairs
          <select id="basepairs">
            <option value="fr3d" selected>fr3d</option>
            <option value="cif">cif</option>
            <option value="rnaview">rnaview</option>
          </select>
        </label>
        <label>Label
          <input type="text" id="label" placeholder="Optional display name">
        </label>
      </div>
      <label class="notes">Notes
        <textarea id="notes" rows="2" placeholder="Optional"></textarea>
      </label>
      <label class="check">
        <input type="checkbox" id="force"> Force re-run even if an identical job is cached
      </label>
    </fieldset>

    <div class="actions">
      <button type="submit" id="generate">Generate</button>
      <span id="form-status" class="form-status"></span>
    </div>
  </form>
</section>

<footer class="ws-footer">
  <span id="runtime"></span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
